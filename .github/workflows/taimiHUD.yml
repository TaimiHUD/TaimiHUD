env:
  CI_ALLOW_ROOT: '1'
  CI_CONFIG: ./ci/config.nix
  CI_PLATFORM: gh-actions
jobs:
  ci-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: taimiHUD check
    runs-on: ubuntu-latest
    steps:
    - id: checkout
      name: git clone
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - id: nix-install
      name: nix install
      uses: arcnmx/ci/actions/nix/install@v0.7
    - id: ci-setup
      name: nix setup
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.ci-check.run.bootstrap
        quiet: false
    - id: ci-action-build
      name: nix build ci.gh-actions.configFile
      uses: arcnmx/ci/actions/nix/build@v0.7
      with:
        attrs: ci.gh-actions.configFile
        out-link: .ci/workflow.yml
    - id: ci-action-compare
      name: gh-actions compare
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        args: -u .github/workflows/taimiHUD.yml .ci/workflow.yml
        attrs: nixpkgs.diffutils
        command: diff
    - id: ci-dirty
      name: nix test dirty
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.ci-check.run.test
        command: ci-build-dirty
        quiet: false
        stdout: ${{ runner.temp }}/ci.build.dirty
    - id: ci-test
      name: nix test build
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.ci-check.run.test
        command: ci-build-realise
        ignore-exit-code: true
        quiet: false
        stdin: ${{ runner.temp }}/ci.build.dirty
    - env:
        CI_EXIT_CODE: ${{ steps.ci-test.outputs.exit-code }}
      id: ci-summary
      name: nix test results
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.ci-check.run.test
        command: ci-build-summarise
        quiet: false
        stdin: ${{ runner.temp }}/ci.build.dirty
        stdout: ${{ runner.temp }}/ci.build.cache
    - env:
        CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
      id: ci-cache
      if: always()
      name: nix test cache
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.ci-check.run.test
        command: ci-build-cache
        quiet: false
        stdin: ${{ runner.temp }}/ci.build.cache
  release:
    if: ${{ (github.event_name != 'push' || (github.event.push.ref == 'refs/heads/main'
      || github.event.push.ref == 'refs/heads/develop' || startsWith(github.event.push.ref,
      'refs/tags'))) && always() || false }}
    name: taimiHUD build --release
    needs:
    - ci-check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - id: checkout
      name: git clone
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - id: nix-install
      name: nix install
      uses: arcnmx/ci/actions/nix/install@v0.7
    - id: ci-setup
      name: nix setup
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.release.run.bootstrap
        quiet: false
    - id: ci-dirty
      name: nix test dirty
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.release.run.test
        command: ci-build-dirty
        quiet: false
        stdout: ${{ runner.temp }}/ci.build.dirty
    - id: ci-test
      name: nix test build
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.release.run.test
        command: ci-build-realise
        ignore-exit-code: true
        quiet: false
        stdin: ${{ runner.temp }}/ci.build.dirty
    - env:
        CI_EXIT_CODE: ${{ steps.ci-test.outputs.exit-code }}
      id: ci-summary
      name: nix test results
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.release.run.test
        command: ci-build-summarise
        quiet: false
        stdin: ${{ runner.temp }}/ci.build.dirty
        stdout: ${{ runner.temp }}/ci.build.cache
    - env:
        CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
      id: ci-cache
      if: always()
      name: nix test cache
      uses: arcnmx/ci/actions/nix/run@v0.7
      with:
        attrs: ci.job.release.run.test
        command: ci-build-cache
        quiet: false
        stdin: ${{ runner.temp }}/ci.build.cache
    - id: artifact-build
      name: artifact build
      uses: arcnmx/ci/actions/nix/build@v0.7
      with:
        attrs: config.jobs.release.artifactPackage
        file: <ci>
        out-link: .ci/artifacts
    - id: artifact-upload
      name: artifact upload
      uses: actions/upload-artifact@v4
      with:
        name: TaimiHUD
        path: .ci/artifacts/lib/TaimiHUD*.dll
    - id: artifact-parse
      name: artifact parse
      run: "NEXUS_TAG_NAME=$(cat .ci/artifacts/share/taimi/release.nexus.tag)\necho\
        \ \"release-nexus-tag=$NEXUS_TAG_NAME\" >> $GITHUB_OUTPUT\nif [[ -n $NEXUS_TAG_NAME\
        \ && $NEXUS_TAG_NAME != \"${{ github.ref_name }}\" ]]; then\n  git fetch origin\
        \ \"refs/tags/$NEXUS_TAG_NAME\" || true\n  git tag -f \"$NEXUS_TAG_NAME\"\
        \ \"${{ github.ref }}\" &&\n  git push -f origin \"$NEXUS_TAG_NAME\" || true\n\
        fi\n"
      shell: bash
    - id: release-upload
      if: startsWith(github.ref, 'refs/tags/v')
      name: release
      uses: softprops/action-gh-release@v1
      with:
        files: .ci/artifacts/lib/TaimiHUD.dll
        name: ${{ contains(github.ref_name, '-') && steps.artifact-parse.outputs.release-nexus-tag
          != github.ref_name && steps.artifact-parse.outputs.release-nexus-tag &&
          format('{0} ({1}-nexus)', github.ref_name, contains(github.ref_name, '-')
          && steps.artifact-parse.outputs.release-nexus-tag != github.ref_name &&
          steps.artifact-parse.outputs.release-nexus-tag) || github.ref_name }}
        prerelease: ${{ contains(github.ref_name, '-') }}
        tag_name: ${{ contains(github.ref_name, '-') && steps.artifact-parse.outputs.release-nexus-tag
          != github.ref_name && steps.artifact-parse.outputs.release-nexus-tag ||
          github.ref_name }}
name: taimiHUD
'on':
  pull_request: {}
  push:
    branches:
    - '**'
    tags:
    - v[0-9]+.[0-9]+.[0-9]+
    - v[0-9]+.[0-9]+.[0-9]+-**
  workflow_dispatch: {}
