[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = { version = "0.3.31", features = [ "sink" ] }
glam = { version = "0.30.3", features = ["mint", "serde"] }
glamour = { version = "0.18.0", features = ["mint", "serde"] }
glob = "0.3.2"
thiserror = "2.0.16"
json-strip-comments = "1.0.4"
log = "0.4.27"
pretty_env_logger = "0.5.0"
reqwest = { version = "0.12.15", default-features=false, features = [ "json", "stream", "rustls-tls-native-roots" ] }
schannel = "0.1.27"
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.140"
strum = "0.27.1"
strum_macros = "0.27.1"
tokio = { version = "1.44.2", features = [ "full" ] }
tokio-into-sink = "0.1.0"
tokio-stream = "0.1.17"
anyhow = "1"

[lints]
workspace = true
