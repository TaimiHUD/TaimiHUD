[package]
name = "taimi_pack"
authors = [ "kittywitch" ]
description = "GW2 TacO packs"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
path = "src/lib.rs"

[[example]]
name = "print_pack"
path = "src/bin/print_pack.rs"
[[example]]
name = "lua_pack"
path = "src/bin/lua_pack.rs"

[lints]
workspace = true

[features]
default = [
  "serde",
  "zip",
  "fixup-typos",
]
serde = [
  "dep:serde",
]
zip = [
  "dep:zip",
]
fixup-typos = [
  "fixup-ladyelyssa",
  "fixup-tehstrails",
  "fixup-fvd",
]
script = []
script-lua = [
  "script",
  "dep:mlua",
]
fixup-ladyelyssa = []
fixup-tehstrails = []
fixup-fvd = []

[dependencies]
taimi_hoard = { path = "../../rt/hoard" }
anyhow = "1"
log = "0.4"
glam = { workspace = true }
glamour = { workspace = true }
indexmap = { workspace = true }
relative-path = "1"
xml-rs = "0.8"
regex = "1"
uuid = "1"
md-5 = "0.10"
base64 = "0.22"
rustc-hash = "2"
zip = { version = "4", optional = true }
bitvec = { workspace = true }
bitflags = { workspace = true }
mlua = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
env_logger = "0.11"
