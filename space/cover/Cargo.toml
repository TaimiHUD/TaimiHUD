[package]
name = "taimi_cover"
authors = [ "kittywitch" ]
description = "TaimiHUD Overlay"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = [
  "windows",
  "serde",
  "imgui180",
  "imgui192",
]
imgui180 = [
  "ui",
  "taimi_ui/imgui-arcdps-legacy",
]
imgui192 = [
  "ui",
  "taimi_ui/imgui-arcdps",
]
ui = [
  "dep:taimi_ui",
]
serde = [
  "dep:serde",
  "dep:serde_json",
  "dep:json-strip-comments",
  "taimi_d3d?/serde",
  "taimi_ui?/serde",
]
windows = [
  "dep:windows",
  "taimi_d3d/windows",
  "taimi_ui?/windows",
  "log/windows",
]

[dependencies]
arcffi = { path = "../../rt/ffi", package = "taimi_ffi", default-features = false }
#taimi_hoard = { path = "../../rt/hoard", default-features = false }
taimi_d3d = { path = "../d3d", default-features = false, features = ["dx11", "arcffi"], optional = true }
log = { path = "../../rt/log", package = "taimi_log", default-features = false }
taimi_meta = { path = "../../pathing/meta", default-features = false }
taimi_ui = { path = "../../rt/ui", default-features = false, optional = true }

anyhow = "1"
num-traits = { workspace = true }
bitflags = { workspace = true }
bitvec = { workspace = true }
glam = { workspace = true }
glamour = { workspace = true }
rustc-hash = { workspace = true }
#arcffi = { workspace = true }

include_dir = { version = "0.7" }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
#serde_jsonrc = { version = "0.1", optional = true, features = [ "preserve_order"] }
json-strip-comments = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies.windows]
optional = true
version = "0.61"
features = [
  "System",
  "Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
]
