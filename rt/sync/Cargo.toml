[package]
name = "taimi_sync"
authors = [ "kittywitch" ]
description = "TaimiHUD synchronization primitives"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = [
]
serde = [
  "dep:serde",
]

[dependencies]
anyhow = "1"
log = "0.4"
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
rustc-hash = "2"
type-map = "0.5"
tokio-stream = "0.1"
tokio-util = "0.7"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
